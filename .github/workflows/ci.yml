name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # db-gate 수동 실행용 (테스트 DB 대상)
  # 이 프로젝트는 마이그레이션을 **배포 없이 Supabase SQL Editor 로** 적용한다(8/11 의 050 이 그랬다).
  # push 에만 걸린 게이트는 그 변경을 영원히 못 본다 → 하루 두 번 스스로 확인한다.
  schedule:
    - cron: '0 1,13 * * *'   # 10:00 / 22:00 KST

# 최소 권한 — 저장소 기본값(설정에 따라 contents: write)을 상속하지 않게 명시한다.
permissions:
  contents: read

jobs:
  # 시크릿 불필요 — 모든 push/PR에서 자동 게이트(타입·린트·단위테스트·빌드).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      # 건수는 적지 않는다 — 늘어날 때마다 어긋나 결국 아무도 안 믿는 숫자가 된다.
      - name: Unit tests (Node 내장 러너)
        run: npm run test:unit
      - name: Build
        run: npm run build
        env:
          # 빌드는 실제 백엔드 연결 없이 통과 — 공개 키가 없어도 정적 분석/타입 통과 확인용 더미.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # 스키마 정합성 게이트 — 코드의 PostgREST 임베드가 **운영 스키마**의 실제 FK 와 맞는지.
  #
  # 8/11 장애(약사 대시보드 4일 접근 불가)가 정확히 이 자리의 공백이었다. 050 이 FK 를 옮기자
  # 임베드가 죽었는데 database.ts 가 옛 관계를 선언하고 있어 tsc·lint·build 가 전부 초록이었다.
  # 임베드 해석은 컴파일 타임이 아니라 **런타임에 PostgREST 가** 하는 일이라 타입 검사로는
  # 원리적으로 못 잡는다 → 실제로 질의해 본다.
  #
  # 운영을 대상으로 도는 것이 핵심이다(문제의 FK 는 운영에만 있었다). 안전은 **공개 키(anon)만
  # 쓰는 것**으로 보장한다 — RLS 때문에 시드도 삭제도 불가능해 "운영을 친다" 는 위험이 없다.
  # 필요 시크릿: SUPABASE_URL / SUPABASE_ANON_KEY (둘 다 공개 값)
  schema-gate:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || github.repository == 'ycorey/yaksaro-care' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # 의존성 설치 불필요 — Node 내장 fetch 만 쓴다.
      - name: 임베드 ↔ FK 정합성
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::warning::SUPABASE_URL/ANON_KEY 시크릿 미설정 — 스키마 게이트를 건너뜁니다."
            exit 0
          fi
          node e2e/embed-integrity-qa.mjs

  # DB/RLS 실측 게이트(약사 토큰 누수·단골 코드 등 11종). 실 DB에 임시 유저를 시드·삭제하므로
  # 운영 DB가 아닌 "테스트/스테이징 Supabase"를 대상으로만 실행할 것 → 수동 트리거(workflow_dispatch).
  # 필요 시크릿(테스트 DB): TEST_SUPABASE_URL / TEST_SUPABASE_ANON_KEY / TEST_SUPABASE_SERVICE_ROLE_KEY
  db-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # 시크릿을 셸 인자/heredoc 본문이 아니라 env 로 받고 printf 로 쓴다.
      # (미인용 heredoc 은 시크릿 안의 $ · 백틱을 셸이 확장/명령치환한다)
      - name: Write .env.local from test-DB secrets (운영 DB 차단 가드)
        env:
          SB_URL:     ${{ secrets.TEST_SUPABASE_URL }}
          SB_ANON:    ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SB_SERVICE: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          PROD_REF:   ${{ secrets.PROD_SUPABASE_REF }}
        run: |
          set -eu
          if [ -z "${SB_URL:-}" ] || [ -z "${SB_ANON:-}" ] || [ -z "${SB_SERVICE:-}" ]; then
            echo "::error::TEST_SUPABASE_* 시크릿이 없습니다. 이 잡은 테스트/스테이징 DB 전용입니다."
            exit 1
          fi
          # 운영 프로젝트 ref 는 저장소에 적지 않고 시크릿으로 주입한다(public 저장소).
          if [ -z "${PROD_REF:-}" ]; then
            echo "::error::PROD_SUPABASE_REF 시크릿이 없어 운영 DB 여부를 판별할 수 없습니다(fail-closed)."
            exit 1
          fi
          if printf '%s' "$SB_URL" | grep -qF "$PROD_REF"; then
            echo "::error::운영 DB 를 대상으로 한 실행을 차단했습니다. 이 잡은 실 DB 에 유저·약국·처방을 시드·삭제합니다."
            exit 1
          fi
          { printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n'      "$SB_URL"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$SB_ANON"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n'     "$SB_SERVICE"
          } > .env.local
      - name: DB/RLS 게이트 (test:e2e:db)
        run: npm run test:e2e:db

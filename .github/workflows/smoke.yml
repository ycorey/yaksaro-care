name: Production smoke

# "배포 성공" 은 "앱이 열린다" 를 보장하지 않는다.
# 2026-08-11 에 약사 대시보드가 4일간 무한 리다이렉트로 접근 불가였는데, 빌드도 배포도
# 성공 상태였고 서버는 500 이 아니라 307 을 무한히 주고 있었다. 그래서 배포가 끝난 **뒤에**
# 실제 URL 을 두드려 본다.
on:
  # Vercel 이 배포 상태를 GitHub 에 보고할 때 발화한다.
  deployment_status:
  # 배포가 없어도 주기적으로 확인한다. 이 프로젝트는 마이그레이션을 배포 없이 SQL Editor 로
  # 적용하므로(8/11 의 050), 배포 이벤트에만 걸어두면 DB 만 바뀌어 앱이 깨지는 경우를 못 본다.
  schedule:
    - cron: '0 1,13 * * *'   # 10:00 / 22:00 KST
  # 배포와 무관하게 지금 상태를 확인하고 싶을 때.
  workflow_dispatch:
    inputs:
      base:
        description: '검사할 베이스 URL'
        required: false
        default: 'https://care.yaksaro.co.kr'

permissions:
  contents: read

jobs:
  smoke:
    # 프로덕션 배포가 성공했을 때만. 프리뷰 배포는 도메인이 매번 달라 의미가 적고,
    # 실패·진행중 상태에서 두드리면 당연히 실패해 소음이 된다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.deployment_status.state == 'success' &&
       contains(fromJSON('["Production","production"]'), github.event.deployment.environment))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # 익명 스모크는 의존성 없이 Node 내장 fetch 만 쓴다(설치 실패가 스모크를 막지 않게).
      - name: Smoke production (익명)
        run: node scripts/smoke-production.mjs "${{ github.event.inputs.base || 'https://care.yaksaro.co.kr' }}"

      # 인증 스모크는 @supabase/ssr 로 세션 쿠키를 만들어야 해서 설치가 필요하다.
      # 익명 단계 뒤에 두어, 설치가 실패해도 위 단계는 이미 결과를 냈다.
      - name: Install deps (인증 스모크용)
        run: npm ci

      # ★ 8/7 장애(약사 대시보드 4일 접근 불가)는 **로그인한 약사에게만** 보이는 무한
      #   리다이렉트였다. 익명 스모크는 문 앞까지만 보므로 그 상황에서도 11/11 PASS 한다
      #   (실측). 그래서 모니터링 전용 약사 계정으로 실제 진입까지 확인한다.
      #   service_role 은 쓰지 않는다 — 시드도 삭제도 하지 않으므로 필요 없다.
      - name: Smoke production (약사 세션)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SMOKE_PHARMACIST_EMAIL: ${{ secrets.SMOKE_PHARMACIST_EMAIL }}
          SMOKE_PHARMACIST_PASSWORD: ${{ secrets.SMOKE_PHARMACIST_PASSWORD }}
        run: node e2e/smoke-authenticated.mjs "${{ github.event.inputs.base || 'https://care.yaksaro.co.kr' }}"
